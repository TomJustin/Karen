<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Karen</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <!-- =========================
             侧边栏
        ========================== -->

        <aside class="sidebar">

            <div class="brand">
                <div class="brand-avatar" id="ai-avatar-brand">
                    K
                </div>

                <div>
                    <h1 id="ai-name-brand">Karen</h1>
                    <span>AI Companion</span>
                </div>
            </div>


            <div class="sidebar-section">

                <button class="new-chat-button">
                    <span class="plus">+</span>
                    新的聊天
                </button>

            </div>


            <div class="sidebar-section">

                <div class="section-title">
                    最近聊天
                </div>

                <div class="chat-history active">
                    <span class="history-icon">💬</span>
                    <span>当前对话</span>
                </div>

            </div>


            <div class="sidebar-bottom">

                <div class="status">

                    <span class="status-dot"></span>

                    <span id="ai-name-status">
                        Karen 在线
                    </span>

                </div>

            </div>

        </aside>


        <!-- =========================
             主聊天区域
        ========================== -->

        <main class="main">

            <!-- 顶部 -->
            <header class="chat-header">

                <div class="karen-info">

                    <div class="karen-avatar" id="ai-avatar-header">
                        K
                    </div>

                    <div class="karen-details">

                        <h2 id="ai-name-header">Karen</h2>

                        <span>
                            <span class="online-dot"></span>
                            在线
                        </span>

                    </div>

                </div>


                <button
                    id="settings-button"
                    class="header-button"
                    title="个性化设置"
                    aria-label="个性化设置"
                >
                    ⚙
                </button>

            </header>


            <!-- 消息区域 -->

            <div
                id="chat-messages"
                class="chat-messages"
            >

                <!--
                    JavaScript 会把聊天消息添加到这里
                -->

            </div>


            <!-- 输入区域 -->

            <div class="input-container">

                <div class="input-box">

                    <input
                        id="message-input"
                        type="text"
                        placeholder="和 Karen 说点什么..."
                        autocomplete="off"
                    >

                    <button
                        id="send-button"
                        class="send-button"
                    >
                        <span>➤</span>
                    </button>

                </div>

                <div class="input-hint">
                    Enter 发送
                </div>

            </div>

        </main>

    </div>


    <!-- 个性化设置弹窗 -->
    <div
        id="profile-overlay"
        class="profile-overlay"
        hidden
        role="dialog"
        aria-modal="true"
        aria-labelledby="profile-title"
    >
        <section class="profile-card">
            <header class="profile-card-header">
                <div class="profile-heading">
                    <div class="profile-brand">K</div>
                    <div>
                        <h2 id="profile-title">个性化你的 AI</h2>
                        <p>设置称呼与性格，让后续交流更符合你的习惯。</p>
                    </div>
                </div>
                <button
                    id="profile-close"
                    class="profile-close"
                    type="button"
                    title="关闭设置"
                    aria-label="关闭设置"
                >×</button>
            </header>

            <form id="profile-form">
                <div class="profile-fields">
                    <div class="profile-field">
                        <label for="profile-user-name">我希望被怎么称呼</label>
                        <input
                            id="profile-user-name"
                            name="userName"
                            type="text"
                            maxlength="80"
                            autocomplete="off"
                            placeholder="例如：小明"
                            required
                        >
                    </div>

                    <div class="profile-field">
                        <label for="profile-ai-name">AI 的名字</label>
                        <input
                            id="profile-ai-name"
                            name="aiName"
                            type="text"
                            maxlength="80"
                            autocomplete="off"
                            placeholder="例如：Karen"
                            required
                        >
                    </div>

                    <div class="profile-field profile-personality-field">
                        <label for="profile-personality">性格与相处方式</label>
                        <textarea
                            id="profile-personality"
                            name="personality"
                            rows="6"
                            maxlength="4000"
                            placeholder="描述你希望 AI 的性格、说话方式，以及不同场景下的交流风格。"
                            required
                        ></textarea>
                        <div class="profile-field-footer">
                            <span>可以自由描述，不局限于固定选项。</span>
                            <span id="profile-personality-count">0 / 4000</span>
                        </div>
                    </div>
                </div>

                <div class="personality-presets">
                    <span class="presets-label">快速模板</span>
                    <button type="button" class="personality-preset" data-personality="温柔、耐心，认真倾听用户，给予支持但不过度迎合。">温柔陪伴</button>
                    <button type="button" class="personality-preset" data-personality="活泼、幽默，表达自然，适当开玩笑，让聊天轻松愉快。">活泼幽默</button>
                    <button type="button" class="personality-preset" data-personality="理性、严谨，重视逻辑和事实，解释清晰，不夸大确定性。">理性严谨</button>
                    <button type="button" class="personality-preset" data-personality="像熟悉的朋友一样自然交流，亲切、有主见，也尊重用户的边界。">自然随和</button>
                </div>

                <p id="profile-status" class="profile-status" role="status" aria-live="polite"></p>

                <div class="profile-actions">
                    <button id="profile-api-key" class="profile-secondary" type="button">配置 API Key</button>
                    <div class="profile-actions-right">
                        <button id="profile-reset" class="profile-secondary" type="button">恢复默认</button>
                        <button id="profile-save" class="profile-save" type="submit">保存设置</button>
                    </div>
                </div>
            </form>
        </section>
    </div>

    <!-- API Key 首次配置 / 更换弹窗 -->
    <div
        id="api-key-overlay"
        class="api-key-overlay"
        hidden
        role="dialog"
        aria-modal="true"
        aria-labelledby="api-key-title"
    >
        <section class="api-key-card">
            <div class="api-key-brand">K</div>
            <h2 id="api-key-title">配置 DeepSeek API Key</h2>
            <p class="api-key-description">
                输入你的 DeepSeek API Key。Karen 会先验证密钥，再将它加密保存到当前 Windows 用户的应用配置中。
            </p>

            <form id="api-key-form">
                <label for="api-key-input">API Key</label>
                <input
                    id="api-key-input"
                    name="apiKey"
                    type="password"
                    autocomplete="off"
                    autocapitalize="off"
                    spellcheck="false"
                    placeholder="粘贴你的 API Key"
                    required
                >

                <p
                    id="api-key-status"
                    class="api-key-status"
                    role="status"
                    aria-live="polite"
                ></p>

                <div class="api-key-actions">
                    <button id="api-key-cancel" class="api-key-cancel" type="button" hidden>
                        取消
                    </button>
                    <button id="api-key-save" class="api-key-save" type="submit">
                        验证并保存
                    </button>
                </div>
            </form>

            <p class="api-key-note">
                密钥不会显示在聊天内容中，也不会由本地后端返回给页面。
            </p>
        </section>
    </div>

    <script src="script.js"></script>

</body>

</html>
