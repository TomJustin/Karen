<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Karen</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <!-- =========================
             侧边栏
        ========================== -->

        <aside class="sidebar">

            <div class="brand">
                <div class="brand-avatar">
                    K
                </div>

                <div>
                    <h1>Karen</h1>
                    <span>AI Companion</span>
                </div>
            </div>


            <div class="sidebar-section">

                <button class="new-chat-button">
                    <span class="plus">+</span>
                    新的聊天
                </button>

            </div>


            <div class="sidebar-section">

                <div class="section-title">
                    最近聊天
                </div>

                <div class="chat-history active">
                    <span class="history-icon">💬</span>
                    <span>当前对话</span>
                </div>

            </div>


            <div class="sidebar-bottom">

                <div class="status">

                    <span class="status-dot"></span>

                    <span>
                        Karen 在线
                    </span>

                </div>

            </div>

        </aside>


        <!-- =========================
             主聊天区域
        ========================== -->

        <main class="main">

            <!-- 顶部 -->
            <header class="chat-header">

                <div class="karen-info">

                    <div class="karen-avatar">
                        K
                    </div>

                    <div class="karen-details">

                        <h2>Karen</h2>

                        <span>
                            <span class="online-dot"></span>
                            在线
                        </span>

                    </div>

                </div>


                <button
                    id="settings-button"
                    class="header-button"
                    title="配置 API Key"
                    aria-label="配置 API Key"
                >
                    ⚙
                </button>

            </header>


            <!-- 消息区域 -->

            <div
                id="chat-messages"
                class="chat-messages"
            >

                <!--
                    JavaScript 会把聊天消息添加到这里
                -->

            </div>


            <!-- 输入区域 -->

            <div class="input-container">

                <div class="input-box">

                    <input
                        id="message-input"
                        type="text"
                        placeholder="和 Karen 说点什么..."
                        autocomplete="off"
                    >

                    <button
                        id="send-button"
                        class="send-button"
                    >
                        <span>➤</span>
                    </button>

                </div>

                <div class="input-hint">
                    Enter 发送
                </div>

            </div>

        </main>

    </div>


    <!-- API Key 首次配置 / 更换弹窗 -->
    <div
        id="api-key-overlay"
        class="api-key-overlay"
        hidden
        role="dialog"
        aria-modal="true"
        aria-labelledby="api-key-title"
    >
        <section class="api-key-card">
            <div class="api-key-brand">K</div>
            <h2 id="api-key-title">配置 DeepSeek API Key</h2>
            <p class="api-key-description">
                输入你的 DeepSeek API Key。Karen 会先验证密钥，再将它加密保存到当前 Windows 用户的应用配置中。
            </p>

            <form id="api-key-form">
                <label for="api-key-input">API Key</label>
                <input
                    id="api-key-input"
                    name="apiKey"
                    type="password"
                    autocomplete="off"
                    autocapitalize="off"
                    spellcheck="false"
                    placeholder="粘贴你的 API Key"
                    required
                >

                <p
                    id="api-key-status"
                    class="api-key-status"
                    role="status"
                    aria-live="polite"
                ></p>

                <div class="api-key-actions">
                    <button id="api-key-cancel" class="api-key-cancel" type="button" hidden>
                        取消
                    </button>
                    <button id="api-key-save" class="api-key-save" type="submit">
                        验证并保存
                    </button>
                </div>
            </form>

            <p class="api-key-note">
                密钥不会显示在聊天内容中，也不会由本地后端返回给页面。
            </p>
        </section>
    </div>

    <script src="script.js"></script>

</body>

</html>
