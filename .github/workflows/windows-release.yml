name: Windows build and release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Avoid two runs for the same PR saving the same vcpkg cache simultaneously.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build MinGW-w64 Windows x64 desktop package
    runs-on: windows-2022
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up MinGW-w64
        uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Add MinGW-w64 tools to PATH
        shell: pwsh
        run: |
          $msys2Root = "${{ steps.msys2.outputs.msys2-location }}"
          $mingwBin = Join-Path $msys2Root "ucrt64\bin"
          foreach ($tool in @("g++.exe", "gcc.exe", "cmake.exe", "ninja.exe")) {
            if (!(Test-Path (Join-Path $mingwBin $tool))) {
              throw "Required MinGW tool is missing: $tool"
            }
          }
          $mingwBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Set up pinned vcpkg
        shell: pwsh
        run: |
          $vcpkgRoot = Join-Path $env:RUNNER_TEMP "vcpkg"
          $vcpkgCommit = "a2f9862da6d88040a8537fb9b8cb24deaa9a196b"

          New-Item -ItemType Directory -Force -Path $vcpkgRoot | Out-Null
          git -C $vcpkgRoot init
          git -C $vcpkgRoot remote add origin https://github.com/microsoft/vcpkg.git
          git -C $vcpkgRoot fetch --depth 1 origin $vcpkgCommit
          if ($LASTEXITCODE -ne 0) { throw "Unable to fetch pinned vcpkg commit." }

          git -C $vcpkgRoot checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw "Unable to check out pinned vcpkg commit." }

          & (Join-Path $vcpkgRoot "bootstrap-vcpkg.bat") -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw "vcpkg bootstrap failed." }

          $binaryCache = Join-Path $env:RUNNER_TEMP "vcpkg-binary-cache"
          $downloads = Join-Path $env:RUNNER_TEMP "vcpkg-downloads"
          New-Item -ItemType Directory -Force -Path $binaryCache, $downloads | Out-Null

          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKG_DEFAULT_BINARY_CACHE=$binaryCache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKG_DOWNLOADS=$downloads" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKG_DEFAULT_HOST_TRIPLET=x64-windows" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore vcpkg caches
        uses: actions/cache@v6
        with:
          path: |
            ${{ runner.temp }}\vcpkg-binary-cache
            ${{ runner.temp }}\vcpkg-downloads
          key: windows-2022-msys2-ucrt64-vcpkg-a2f9862da6d88040a8537fb9b8cb24deaa9a196b-x64-mingw-dynamic-${{ hashFiles('packaging/vcpkg-dependencies.txt') }}
          restore-keys: |
            windows-2022-msys2-ucrt64-vcpkg-a2f9862da6d88040a8537fb9b8cb24deaa9a196b-x64-mingw-dynamic-

      - name: Install C++ dependencies
        shell: pwsh
        run: |
          $dependencies = Get-Content "packaging\vcpkg-dependencies.txt" |
            ForEach-Object { $_.Trim() } |
            Where-Object { $_ -and -not $_.StartsWith("#") }

          & "$env:VCPKG_ROOT\vcpkg.exe" install $dependencies --clean-after-build
          if ($LASTEXITCODE -ne 0) { throw "vcpkg dependency installation failed." }

      - name: Configure CMake
        shell: pwsh
        run: |
          $msys2Root = "${{ steps.msys2.outputs.msys2-location }}"
          $mingwBin = Join-Path $msys2Root "ucrt64\bin"
          $toolchain = Join-Path $env:VCPKG_ROOT "scripts\buildsystems\vcpkg.cmake"
          $cmake = Join-Path $mingwBin "cmake.exe"
          $ninja = Join-Path $mingwBin "ninja.exe"
          $gcc = Join-Path $mingwBin "gcc.exe"
          $gxx = Join-Path $mingwBin "g++.exe"

          $cmakeArgs = @(
            "-S", ".", "-B", "build-release", "-G", "Ninja",
            "-DCMAKE_MAKE_PROGRAM=$ninja",
            "-DCMAKE_C_COMPILER=$gcc",
            "-DCMAKE_CXX_COMPILER=$gxx",
            "-DCMAKE_TOOLCHAIN_FILE=$toolchain",
            "-DVCPKG_TARGET_TRIPLET=x64-mingw-dynamic",
            "-DVCPKG_HOST_TRIPLET=x64-windows",
            "-DCMAKE_BUILD_TYPE=Release"
          )

          & $cmake @cmakeArgs
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed." }

      - name: Build Release
        shell: pwsh
        run: |
          $cmake = Join-Path "${{ steps.msys2.outputs.msys2-location }}" "ucrt64\bin\cmake.exe"
          & $cmake --build build-release --parallel
          if ($LASTEXITCODE -ne 0) { throw "Karen MinGW Release build failed." }

      - name: Assemble portable package
        shell: pwsh
        run: |
          $dist = Join-Path $PWD "dist"
          $stage = Join-Path $dist "Karen"
          $stageFrontend = Join-Path $stage "frontend"
          $runtime = Join-Path $PWD "build-release"
          $dependencyBin = Join-Path $env:VCPKG_ROOT "installed\x64-mingw-dynamic\bin"
          $mingwBin = Join-Path "${{ steps.msys2.outputs.msys2-location }}" "ucrt64\bin"

          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          New-Item -ItemType Directory -Force -Path $stageFrontend | Out-Null

          if (!(Test-Path (Join-Path $runtime "Karen.exe"))) {
            throw "Karen.exe was not produced by the MinGW Release build."
          }
          if (!(Test-Path (Join-Path $runtime "frontend\index.html"))) {
            throw "Frontend files were not copied beside Karen.exe."
          }

          Copy-Item (Join-Path $runtime "Karen.exe") $stage -Force
          Copy-Item (Join-Path $runtime "frontend\*") $stageFrontend -Recurse -Force
          if (!(Test-Path (Join-Path $stageFrontend "index.html"))) {
            throw "The staged frontend is missing index.html."
          }

          # The x64-mingw-dynamic triplet ships shared dependency DLLs beside the EXE.
          if (Test-Path $dependencyBin) {
            Get-ChildItem $dependencyBin -Filter "*.dll" -File |
              ForEach-Object { Copy-Item $_.FullName $stage -Force }
          }

          # Include the compiler runtime DLLs required by MinGW-built binaries.
          foreach ($dll in @("libstdc++-6.dll", "libgcc_s_seh-1.dll", "libwinpthread-1.dll", "libssp-0.dll")) {
            $runtimeDll = Join-Path $mingwBin $dll
            if (Test-Path $runtimeDll) {
              Copy-Item $runtimeDll $stage -Force
            }
          }

          Copy-Item "packaging\README.txt" $stage -Force

          $zip = Join-Path $PWD "dist\Karen-windows-x64.zip"
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath $zip -CompressionLevel Optimal -Force

          $sha256 = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha256  Karen-windows-x64.zip" | Set-Content (Join-Path $PWD "dist\SHA256SUMS.txt") -Encoding ascii

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: karen-windows-x64
          path: |
            dist/Karen-windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download packaged files
        uses: actions/download-artifact@v8
        with:
          name: karen-windows-x64
          path: release-assets

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release create $tag "release-assets/Karen-windows-x64.zip" "release-assets/SHA256SUMS.txt" --verify-tag --generate-notes --title "Karen $tag"
          if ($LASTEXITCODE -ne 0) { throw "Publishing the GitHub Release failed." }
